name: Baldi's Basics Plus iOS - FIRST IPA v19 PIPEFIX

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build_unity_ios:
    name: 1. Recover APK + Build iOS Xcode
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work tools recovered output build
          mkdir -p work tools recovered output build

          for cmd in curl jq unzip strings gh python3; do
            command -v "$cmd" >/dev/null || {
              echo "ERROR: missing tool: $cmd"
              exit 1
            }
          done

      - name: Download largest APK from newest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"

          if [ -z "$TAG" ]; then
            echo "ERROR: No GitHub Release exists yet."
            echo "Upload your Baldi APK to a Release, then run this workflow again."
            exit 1
          fi

          echo "Using release: $TAG"

          mkdir -p work/release
          gh release download "$TAG" \
            --dir work/release \
            --pattern "*.apk"

          APK="$(
            find work/release -type f -iname '*.apk' -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: No APK was found in the newest Release."
            exit 1
          fi

          cp "$APK" work/BaldisPlus.apk

          echo "===== APK ====="
          ls -lh work/BaldisPlus.apk
          echo "APK=$APK" | tee output/apk.txt

      - name: Extract APK and detect Unity
        id: inspect
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/android
          unzip -q work/BaldisPlus.apk -d work/android

          echo "===== APK ABI ====="
          find work/android/lib -maxdepth 2 -type f -name '*.so' -print 2>/dev/null \
            | tee output/native-libs.txt || true

          # Baldi Mobile 0.14Pre stores the Unity player data in
          # assets/bin/Data and may NOT contain globalgamemanagers.
          DATA_DIR=""

          GGM="$(find work/android -type f -name globalgamemanagers -print | head -1 || true)"
          if [ -n "$GGM" ]; then
            DATA_DIR="$(dirname "$GGM")"
          fi

          if [ -z "$DATA_DIR" ] && [ -d "work/android/assets/bin/Data" ]; then
            DATA_DIR="work/android/assets/bin/Data"
          fi

          if [ -z "$DATA_DIR" ]; then
            DATA_UNITY3D="$(find work/android -type f -name 'data.unity3d' -print | head -1 || true)"
            if [ -n "$DATA_UNITY3D" ]; then
              DATA_DIR="$(dirname "$DATA_UNITY3D")"
            fi
          fi

          if [ -z "$DATA_DIR" ]; then
            BOOT="$(find work/android -type f -name boot.config -print | head -1 || true)"
            if [ -n "$BOOT" ]; then
              DATA_DIR="$(dirname "$BOOT")"
            fi
          fi

          if [ -z "$DATA_DIR" ] || [ ! -d "$DATA_DIR" ]; then
            echo "ERROR: Unity Data directory not found."
            find work/android -maxdepth 5 -type f | head -400
            exit 1
          fi

          echo "$DATA_DIR" > output/unity-data-dir.txt

          echo "===== UNITY DATA DIR ====="
          echo "$DATA_DIR"
          find "$DATA_DIR" -maxdepth 2 -type f -print | head -250

          VERSION=""

          # Try all small Unity data files instead of requiring globalgamemanagers.
          while IFS= read -r f; do
            CANDIDATE="$(
              strings "$f" 2>/dev/null \
                | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
                | head -1 || true
            )"
            if [ -n "$CANDIDATE" ]; then
              VERSION="$CANDIDATE"
              echo "Unity version found in: $f"
              break
            fi
          done < <(
            find "$DATA_DIR" -maxdepth 2 -type f -size -64M -print
          )

          if [ -z "$VERSION" ]; then
            # Unity native libraries often contain the engine version too.
            while IFS= read -r f; do
              CANDIDATE="$(
                strings "$f" 2>/dev/null \
                  | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
                  | head -1 || true
              )"
              if [ -n "$CANDIDATE" ]; then
                VERSION="$CANDIDATE"
                echo "Unity version found in native library: $f"
                break
              fi
            done < <(
              find work/android/lib -type f \( -name 'libunity.so' -o -name 'libmain.so' \) -print 2>/dev/null
            )
          fi

          if [ -z "$VERSION" ]; then
            VERSION="UNKNOWN"
          fi

          MANAGED="$(find "$DATA_DIR" -type f -path '*/Managed/Assembly-CSharp.dll' -print | head -1 || true)"
          META="$(find work/android -type f -name global-metadata.dat -print | head -1 || true)"
          IL2CPP="$(find work/android/lib -type f -name 'libil2cpp.so' -print | head -1 || true)"

          if [ -n "$MANAGED" ]; then
            BACKEND="MONO"
          elif [ -n "$META" ] || [ -n "$IL2CPP" ]; then
            BACKEND="IL2CPP"
          else
            BACKEND="UNKNOWN"
          fi

          {
            echo "UNITY_VERSION=$VERSION"
            echo "SCRIPT_BACKEND=$BACKEND"
            echo "DATA_DIR=$DATA_DIR"
            echo "GLOBALGAMEMANAGERS=${GGM:-NONE}"
            echo "MANAGED=${MANAGED:-NONE}"
            echo "GLOBAL_METADATA=${META:-NONE}"
            echo "IL2CPP_LIB=${IL2CPP:-NONE}"
          } | tee output/inspect.txt

          echo "unity_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"

      - name: Download AssetRipper 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' \
            | tee output/assetripper-assets.txt

          ASSET="$(
            grep -Ei '^AssetRipper_linux_(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
              output/assetripper-assets.txt \
              | head -1 || true
          )"

          if [ -z "$ASSET" ]; then
            ASSET="$(
              grep -Ei 'linux.*(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
                output/assetripper-assets.txt \
                | head -1 || true
            )"
          fi

          if [ -z "$ASSET" ]; then
            echo "ERROR: Linux x64 AssetRipper package not found."
            exit 1
          fi

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p "$ASSET" \
            -D tools

          mkdir -p tools/assetripper

          case "tools/$ASSET" in
            *.tar.xz) tar -xJf "tools/$ASSET" -C tools/assetripper ;;
            *.zip) unzip -q "tools/$ASSET" -d tools/assetripper ;;
            *) echo "Unsupported AssetRipper archive"; exit 1 ;;
          esac

          RIPPER="$(
            find tools/assetripper -type f \
              \( -name 'AssetRipper.GUI.Free' \
                 -o -name 'AssetRipper.GUI' \
                 -o -name 'AssetRipper' \) \
              | head -1
          )"

          if [ -z "$RIPPER" ]; then
            echo "ERROR: AssetRipper executable not found."
            find tools/assetripper -maxdepth 4 -type f | head -300
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "$RIPPER" > output/assetripper-path.txt

      - name: Recover Unity project
        shell: bash
        run: |
          set -euo pipefail

          RIPPER="$(cat output/assetripper-path.txt)"
          GAME_ROOT="$PWD/work/android"
          APK_PATH="$PWD/work/BaldisPlus.apk"
          PORT=3333
          EXPORT_DIR="$PWD/recovered/BaldisPlus"

          mkdir -p "$EXPORT_DIR"

          "$RIPPER" --headless --port "$PORT" \
            > output/assetripper.log 2>&1 &

          PID=$!

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: AssetRipper did not start."
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "===== ASSETRIPPER INPUT ====="
          echo "Loading FULL extracted Android root so AssetRipper can see:"
          echo " - assets/bin/Data"
          echo " - lib/arm64-v8a/libil2cpp.so"
          echo " - global-metadata.dat"
          echo "GAME_ROOT=$GAME_ROOT"

          LOAD_CODE="$(
            curl -sS \
              -o output/load-response.txt \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$GAME_ROOT" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )"

          echo "LOAD_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "200" ] && [ "$LOAD_CODE" != "302" ]; then
            cat output/load-response.txt || true
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "===== ASSETRIPPER BACKEND CHECK ====="
          grep -Ei 'scripting backend|IL2CPP|Cpp2IL|global-metadata|libil2cpp' \
            output/assetripper.log \
            | tail -120 \
            | tee output/assetripper-backend.txt || true

          if grep -Fq "Files use the 'Unknown' scripting backend." output/assetripper.log; then
            echo "WARNING: folder load still reported Unknown backend."
            echo "Retrying by loading the APK file directly."

            curl -sS -X POST "http://127.0.0.1:${PORT}/Reset" >/dev/null || true
            sleep 2

            LOAD_FILE_CODE="$(
              curl -sS \
                -o output/load-file-response.txt \
                -w '%{http_code}' \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "Path=$APK_PATH" \
                "http://127.0.0.1:${PORT}/LoadFile"
            )"

            echo "LOAD_FILE_HTTP=$LOAD_FILE_CODE"

            if [ "$LOAD_FILE_CODE" != "200" ] && [ "$LOAD_FILE_CODE" != "302" ]; then
              cat output/load-file-response.txt || true
              tail -300 output/assetripper.log || true
              exit 1
            fi
          fi

          EXPORT_CODE="$(
            curl -sS \
              -o output/export-response.txt \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$EXPORT_DIR" \
              --data-urlencode 'CreateSubfolder=false' \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )"

          echo "EXPORT_HTTP=$EXPORT_CODE"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ "$EXPORT_CODE" != "200" ] && [ "$EXPORT_CODE" != "302" ]; then
            cat output/export-response.txt || true
            tail -250 output/assetripper.log || true
            exit 1
          fi

          PROJECT=""

          if [ -d "$EXPORT_DIR/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT_DIR/ExportedProject"
          elif [ -d "$EXPORT_DIR/Assets" ]; then
            PROJECT="$EXPORT_DIR"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: recovered Unity project not found."
            find "$EXPORT_DIR" -maxdepth 4 -type d | head -300
            exit 1
          fi

          echo "$PROJECT" > output/project-path.txt

          echo "===== RECOVERED PROJECT ====="
          echo "$PROJECT"
          find "$PROJECT/Assets" -type f -name '*.unity' | head -100

          {
            echo "===== ASSETRIPPER SCRIPT/BACKEND SUMMARY ====="
            grep -Ei \
              'scripting backend|IL2CPP|Cpp2IL|decompil|script export|game assemblies|global-metadata|libil2cpp' \
              output/assetripper.log \
              | tail -300 || true
          } > output/assetripper-script-summary.txt

          cat output/assetripper-script-summary.txt

          GAME_CS="$(
            find "$PROJECT/Assets" -type f -name '*.cs' \
              | grep -Ev '/(Packages|Plugins/|Editor/)' \
              | wc -l \
              | tr -d ' '
          )"

          echo "RECOVERED_GAME_CS=$GAME_CS" | tee output/recovered-game-code.txt

      - name: Prepare recovered project for iOS
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"

          echo "===== REMOVE ANDROID-ONLY NATIVE PLUGINS ====="
          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' \) \
            -print \
            | tee output/removed-android-files.txt || true

          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' \) \
            -delete || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true

          VERSION_FILE="$PROJECT/ProjectSettings/ProjectVersion.txt"

          mkdir -p "$PROJECT/ProjectSettings"

          cat > "$VERSION_FILE" <<'UNITY_VERSION_EOF'
          m_EditorVersion: 2021.2.0b11
          m_EditorVersionWithRevision: 2021.2.0b11 (0bffbba03cb9)
          UNITY_VERSION_EOF

          echo "===== PROJECT VERSION - EXACT APK UNITY ====="
          cat "$VERSION_FILE"

          mkdir -p "$PROJECT/Assets/Editor"

          cat > "$PROJECT/Assets/Editor/BaldiIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class BaldiIOSBuild
          {
              public static void PerformBuild()
              {
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s != null && s.enabled && !string.IsNullOrWhiteSpace(s.path))
                      .Select(s => s.path)
                      .Where(IsValidScene)
                      .Distinct()
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      scenes = AssetDatabase.FindAssets("t:Scene", new[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(IsValidScene)
                          .Distinct()
                          .OrderBy(p => p)
                          .ToArray();
                  }

                  if (scenes.Length == 0)
                      throw new Exception("No valid Unity scenes were recovered.");

                  Debug.Log("BALDI IOS SCENES: " + scenes.Length);
                  foreach (string scene in scenes)
                      Debug.Log("SCENE: " + scene);

                  EditorBuildSettings.scenes = scenes
                      .Select(p => new EditorBuildSettingsScene(p, true))
                      .ToArray();

                  string output = Path.GetFullPath(
                      Path.Combine(Application.dataPath, "../../build/iOS/BaldisPlus-iOS")
                  );

                  Directory.CreateDirectory(output);

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.applicationIdentifier =
                      "com.baldisplus.ios.port";

                  PlayerSettings.iOS.targetOSVersionString = "15.0";

                  BuildPlayerOptions options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);

                  Debug.Log("BALDI IOS RESULT: " + report.summary.result);
                  Debug.Log("BALDI IOS ERRORS: " + report.summary.totalErrors);
                  Debug.Log("BALDI IOS WARNINGS: " + report.summary.totalWarnings);

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception(
                          "Baldi iOS build failed: " + report.summary.result +
                          ", errors=" + report.summary.totalErrors
                      );
              }

              private static bool IsValidScene(string path)
              {
                  if (string.IsNullOrWhiteSpace(path))
                      return false;

                  string normalized = path.Replace('\\', '/');

                  if (!normalized.EndsWith(".unity", StringComparison.OrdinalIgnoreCase))
                      return false;

                  SceneAsset asset =
                      AssetDatabase.LoadAssetAtPath<SceneAsset>(normalized);

                  if (asset != null)
                      return true;

                  string root =
                      Directory.GetParent(Application.dataPath).FullName;

                  return File.Exists(Path.Combine(root, normalized));
              }
          }
          CS

          PROJECT="$(realpath "$PROJECT")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          UNITY_VERSION="$(
            sed -n 's/^m_EditorVersion:[[:space:]]*//p' "$VERSION_FILE" \
              | head -1
          )"

          echo "unity_version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "RECOVERED_PROJECT=$PROJECT"
            echo "UNITY_VERSION=$UNITY_VERSION"
            echo "BACKEND=${{ steps.inspect.outputs.backend }}"
            echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
            echo "CS_FILES=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"
          } | tee output/recovery-summary.txt

      - name: Prepare host Unity Hub FAST
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FAST HOST UNITY HUB ====="
          echo "No full apt update. Only the Unity repository is refreshed."

          sudo install -d -m 0755 /etc/apt/keyrings

          curl --connect-timeout 15 --max-time 60 -fsSL \
            https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor --yes \
              -o /etc/apt/keyrings/unityhub.gpg

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/unityhub.list >/dev/null

          timeout 120s sudo apt-get \
            -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/unityhub.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0" \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update

          echo "===== UNITY HUB CANDIDATE ====="
          apt-cache policy unityhub || true

          timeout 180s sudo apt-get install -y --no-install-recommends unityhub

          REAL_HUB="$(command -v unityhub || true)"

          if [ -z "$REAL_HUB" ]; then
            echo "ERROR: unityhub command not found after install"
            dpkg -L unityhub 2>/dev/null | head -200 || true
            exit 1
          fi

          sudo mkdir -p /opt/unityhub

          sudo tee /opt/unityhub/unityhub >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$REAL_HUB" --no-sandbox --headless "\$@"
          EOF

          sudo chmod +x /opt/unityhub/unityhub
          sudo ln -sf /opt/unityhub/unityhub /usr/local/bin/unity-hub

          echo "UNITY_HUB_PATH=/opt/unityhub/unityhub" >> "$GITHUB_ENV"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          echo "REAL_HUB=$REAL_HUB"
          echo "REAL_UNITY_HUB=$REAL_HUB" >> "$GITHUB_ENV"

          UNITY_INSTALL_ROOT="$HOME/Unity/Hub/Editor"
          mkdir -p "$UNITY_INSTALL_ROOT"
          echo "UNITY_INSTALL_ROOT=$UNITY_INSTALL_ROOT" >> "$GITHUB_ENV"

          ls -l /opt/unityhub/unityhub

          timeout 30s xvfb-run -a "$REAL_HUB" --no-sandbox --headless help >/dev/null 2>&1 || true

      - name: Install exact Unity 2021.2.0b11 + iOS support MANUALLY
        id: unity_setup
        shell: bash
        run: |
          set -euo pipefail

          HUB="${REAL_UNITY_HUB}"
          ROOT="${UNITY_INSTALL_ROOT}"
          VERSION="2021.2.0b11"
          CHANGESET="0bffbba03cb9"

          echo "===== MANUAL UNITY HUB INSTALL ====="
          echo "HUB=$HUB"
          echo "ROOT=$ROOT"
          echo "VERSION=$VERSION"
          echo "CHANGESET=$CHANGESET"

          # Tell Hub exactly where to install Editors.
          timeout 120s env -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a "$HUB" --no-sandbox --headless \
            install-path -s "$ROOT"

          # Install the exact beta Editor and iOS Build Support.
          # This completely bypasses RageAgainstThePixel/unity-setup,
          # including its broken post-step that reported "Unity Hub is not installed".
          timeout 1800s env -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a "$HUB" --no-sandbox --headless \
            install \
            --version "$VERSION" \
            --changeset "$CHANGESET" \
            --module ios

          echo "===== INSTALLED EDITORS ====="
          timeout 120s env -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a "$HUB" --no-sandbox --headless \
            editors -i || true

          EDITOR="$ROOT/$VERSION/Editor/Unity"

          if [ ! -x "$EDITOR" ]; then
            EDITOR="$(
              find "$ROOT" "$HOME" /opt \
                -type f \
                -path "*/$VERSION/Editor/Unity" \
                -print 2>/dev/null \
                | head -1 || true
            )"
          fi

          if [ -z "$EDITOR" ] || [ ! -x "$EDITOR" ]; then
            echo "ERROR: Exact Unity Editor executable not found after Hub install."
            find "$ROOT" "$HOME" /opt \
              -maxdepth 8 \
              -type f \
              -name Unity \
              -print 2>/dev/null \
              | head -200 || true
            exit 1
          fi

          echo "UNITY_EDITOR_PATH=$EDITOR" >> "$GITHUB_ENV"
          echo "unity-editor-path=$EDITOR" >> "$GITHUB_OUTPUT"

          echo "UNITY_EDITOR=$EDITOR"
          "$EDITOR" -version || true

      - name: Stage Unity Licensing Client for activation
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FIND UNITY LICENSING CLIENT ====="

          CLIENT="$(
            find \
              "${UNITY_INSTALL_ROOT:-$HOME/Unity/Hub/Editor}" \
              "$HOME" \
              /opt \
              /usr \
              -type f \
              -name "Unity.Licensing.Client" \
              -print 2>/dev/null \
              | head -1 || true
          )"

          if [ -z "$CLIENT" ] || [ ! -f "$CLIENT" ]; then
            echo "ERROR: Unity.Licensing.Client was not found after Editor installation."
            find \
              "${UNITY_INSTALL_ROOT:-$HOME/Unity/Hub/Editor}" \
              "$HOME" \
              /opt \
              /usr \
              -type f \
              \( -iname "*Licensing*Client*" -o -iname "Unity.Licensing*" \) \
              -print 2>/dev/null \
              | head -300 || true
            exit 1
          fi

          echo "FOUND_CLIENT=$CLIENT"

          CLIENT_DIR="$(dirname "$CLIENT")"

          # activate-unity-license@v2 searches specifically under:
          # /opt/unityhub/**/Unity.Licensing.Client
          # Copy the WHOLE client folder because the binary needs sibling files.
          sudo rm -rf /opt/unityhub/UnityLicensingClient
          sudo mkdir -p /opt/unityhub/UnityLicensingClient
          sudo cp -a "$CLIENT_DIR"/. /opt/unityhub/UnityLicensingClient/
          sudo chmod +x /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client || true

          test -x /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client

          echo "===== STAGED CLIENT ====="
          # Avoid pipefail + SIGPIPE from `find | head`, which made v18 fail
          # even though the Licensing Client had already been copied correctly.
          find /opt/unityhub/UnityLicensingClient \
            -maxdepth 2 \
            -type f \
            -print \
            > output/licensing-client-files.txt || true

          sed -n '1,120p' output/licensing-client-files.txt || true

      - name: Activate Unity Personal on SAME host
        id: unity_license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Build FIRST iOS Xcode project DIRECTLY
        id: unity_build_host
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          PROJECT="${{ steps.prepare.outputs.project }}"
          EDITOR="${UNITY_EDITOR_PATH}"

          echo "===== DIRECT UNITY BUILD ON LICENSED HOST ====="
          echo "PROJECT=$PROJECT"
          echo "EDITOR=$EDITOR"

          mkdir -p output

          "$EDITOR" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod BaldiIOSBuild.PerformBuild \
            -logFile "$PWD/output/unity-host-build.log"

          RC=$?

          echo "UNITY_EXIT=$RC" | tee output/unity-exit.txt

          echo "===== UNITY LOG TAIL ====="
          tail -250 output/unity-host-build.log || true

          exit "$RC"

      - name: Locate Unity iOS Xcode output
        id: xcode
        if: always()
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.prepare.outputs.project }}"

          if [ -f output/xcode-path.txt ]; then
            XCODE_DIR="$(cat output/xcode-path.txt)"
          else
            XCODE_DIR="$(
              find "$PROJECT/../.." "$PWD/build" \
                -type d -name '*.xcodeproj' -print 2>/dev/null \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          if [ -n "$XCODE_DIR" ] && [ -d "$XCODE_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "$XCODE_DIR" > output/xcode-path.txt
            echo "XCODE_DIR=$XCODE_DIR"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Xcode project not found."
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "BALDI PLUS iOS FIRST IPA v19 PIPEFIX"
            echo "========================================"
            echo
            cat output/inspect.txt 2>/dev/null
            echo
            cat output/recovery-summary.txt 2>/dev/null
            echo
            cat output/assetripper-script-summary.txt 2>/dev/null
            echo
            echo "UNITY_SETUP_OUTCOME=${{ steps.unity_setup.outcome }}"
            echo "UNITY_LICENSE_OUTCOME=${{ steps.unity_license.outcome }}"
            echo "UNITY_BUILD_OUTCOME=${{ steps.unity_build_host.outcome }}"
            echo "UNITY_EDITOR=${UNITY_EDITOR_PATH:-}"
            echo "XCODE_READY=${{ steps.xcode.outputs.ready }}"
          } > output/summary.txt

          tail -500 output/assetripper.log \
            > output/assetripper-tail.txt 2>/dev/null || true

          PROJECT="$(cat output/project-path.txt 2>/dev/null || true)"

          if [ -n "$PROJECT" ]; then
            find "$PROJECT/Assets" -type f -name '*.unity' \
              > output/recovered-scenes.txt 2>/dev/null || true
          fi

          mkdir -p output/unity-host-logs

          # Unity/RageAgainstThePixel log locations can vary by runner/action version.
          for ROOT in \
            "$HOME/.config/unity3d" \
            "$HOME/.local/share/unity3d" \
            "$RUNNER_TEMP" \
            "$GITHUB_WORKSPACE"
          do
            if [ -d "$ROOT" ]; then
              find "$ROOT" -type f \
                \( -name 'Editor.log' \
                   -o -name 'Unity.Licensing.Client.log' \
                   -o -name 'Unity.Entitlements.Audit.log' \
                   -o -name '*baldi-ios-v19-direct-build*' \
                   -o -name '*.log' \) \
                -print 2>/dev/null \
                | head -150 \
                | while IFS= read -r F; do
                    SAFE="$(echo "$F" | sed 's#/#_#g')"
                    cp "$F" "output/unity-host-logs/$SAFE" 2>/dev/null || true
                  done
            fi
          done

          {
            echo "===== DIRECT UNITY BUILD ERRORS ====="
            grep -Ein \
              '(^|[^A-Za-z])(error|exception|fatal|CS[0-9]{4}|BuildFailed|BuildPlayer|compilation failed|script compilation|Aborting batchmode)' \
              output/unity-host-build.log 2>/dev/null \
              | head -600 || true

            echo
            echo "===== HOST UNITY ERRORS ====="
            grep -RinE \
              '(^|[^A-Za-z])(error|exception|fatal|CS[0-9]{4}|BuildFailed|BuildPlayer|compilation failed|script compilation|Aborting batchmode)' \
              output/unity-host-logs 2>/dev/null \
              | head -600 || true
          } > output/important-errors.txt

          echo "===== IMPORTANT ERRORS ====="
          cat output/important-errors.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Baldis-Plus-iOS-Diagnostics-v19-FIRST-IPA
          path: output
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Stage Xcode project for packaging job
        if: steps.xcode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          XCODE_DIR="$(cat output/xcode-path.txt)"
          rm -rf xcode-stage
          mkdir -p xcode-stage
          cp -a "$XCODE_DIR"/. xcode-stage/

      - name: Upload staged Xcode project
        if: steps.xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Baldis-Plus-iOS-Xcode-STAGED-v19
          path: xcode-stage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package_ipa:
    name: 2. Make unsigned IPA for Signulous
    needs: build_unity_ios
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: Baldis-Plus-iOS-Xcode-STAGED-v19
          path: unity-ios

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== XCODE ====="
          xcodebuild -version

          PROJ="$(find unity-ios -type d -name '*.xcodeproj' | head -1)"

          if [ -z "$PROJ" ]; then
            echo "ERROR: .xcodeproj not found."
            find unity-ios -maxdepth 5 -print | head -500
            exit 1
          fi

          echo "$PROJ" > xcode-project.txt
          xcodebuild -project "$PROJ" -list

      - name: Build unsigned arm64 iPhone app
        shell: bash
        run: |
          set -o pipefail

          PROJ="$(cat xcode-project.txt)"

          SCHEME="$(
            xcodebuild -project "$PROJ" -list 2>/dev/null \
              | awk '
                  /Schemes:/ {inside=1; next}
                  inside && NF {
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
                    print
                    exit
                  }
                '
          )"

          if [ -z "$SCHEME" ]; then
            SCHEME="Unity-iPhone"
          fi

          echo "SCHEME=$SCHEME"

          rm -rf DerivedData output
          mkdir -p output

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="com.baldisplus.ios.port" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            build \
            2>&1 | tee output/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find DerivedData/Build/Products \
              -type d -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: built .app not found."
            find DerivedData/Build/Products -maxdepth 5 -print | head -500
            exit 1
          fi

          echo "APP=$APP"

          rm -rf output/Payload
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/BaldisPlus.app

          cd output
          /usr/bin/zip -qry Baldis-Plus-iOS-v19-FIRST-UNSIGNED.ipa Payload
          rm -rf Payload

          ls -lh Baldis-Plus-iOS-v19-FIRST-UNSIGNED.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Baldis-Plus-iOS-v19-FIRST-IPA
          path: |
            output/Baldis-Plus-iOS-v19-FIRST-UNSIGNED.ipa
            output/xcodebuild.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
